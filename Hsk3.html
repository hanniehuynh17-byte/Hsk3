const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ============= WEB SPEECH HOOK =============
function useSpeech() {
  const [speaking, setSpeaking] = useState(false);
  const [supported, setSupported] = useState(false);
  const utterRef = useRef(null);

  useEffect(() => {
    setSupported('speechSynthesis' in window);
    return () => { if (utterRef.current) window.speechSynthesis.cancel(); };
  }, []);

  const speak = useCallback((text) => {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    u.pitch = 1;
    // Ưu tiên giọng Trung nếu có
    const voices = window.speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang.startsWith('zh'));
    if (zhVoice) u.voice = zhVoice;
    u.onstart = () => setSpeaking(true);
    u.onend = () => setSpeaking(false);
    u.onerror = () => setSpeaking(false);
    utterRef.current = u;
    window.speechSynthesis.speak(u);
  }, []);

  const stop = useCallback(() => {
    window.speechSynthesis.cancel();
    setSpeaking(false);
  }, []);

  return { speak, stop, speaking, supported };
}

const SIZE = 20;

const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const pickDaily = (seed) => {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) & 0xffffffff;
  const arr = HSK3.map((w, i) => ({ w, k: Math.abs(Math.sin(h + i * 9301)) }));
  arr.sort((a, b) => a.k - b.k);
  return arr.slice(0, SIZE).map(x => x.w);
};

  .hsk-no-tts { text-align:center; padding:8px; font-family:'JetBrains Mono',monospace; font-size:10px; opacity:0.45; letter-spacing:0.1em; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  .fade-in { animation:fadeIn 0.4s ease-out both; }
`;

function AddWordScreen({ onBack, onAdded }) {
  const [hz, setHz] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [err, setErr] = useState('');
  const [customWords, setCustomWords] = useState(() => {
    try { return JSON.parse(localStorage.getItem('hsk3_custom_words') || '[]'); } catch { return []; }
  });

  const lookup = async () => {
    const word = hz.trim();
    if (!word) return;
    // Check if already in HSK3
    const existing = HSK3.find(w => w.hz === word);
    if (existing) { setErr(`"${word}" đã có trong danh sách HSK 3 rồi!`); return; }
    setLoading(true); setErr(''); setResult(null);
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: `Cho từ tiếng Trung: "${word}"\nHãy trả lời CHÍNH XÁC theo JSON này (không có text nào khác):\n{"hz":"${word}","py":"pinyin","vi":"nghĩa tiếng Việt ngắn gọn","ex":"câu ví dụ tiếng Trung","exv":"dịch câu ví dụ sang tiếng Việt","radical":"bộ thủ chính (chữ Hán)","radicalName":"tên bộ thủ (tiếng Việt Hán-Việt)","strokes":số_nét,"meaning":"giải thích nguồn gốc ngắn"}`
          }]
        })
      });
      const data = await res.json();
      const text = data.content?.find(c=>c.type==='text')?.text || '';
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('Không parse được');
      const parsed = JSON.parse(match[0]);
      setResult(parsed);
    } catch(e) {
      setErr('Không tra được từ này. Kiểm tra kết nối internet và thử lại.');
    }
    setLoading(false);
  };

  const save = () => {
    if (!result) return;
    const newWords = [...customWords, result];
    setCustomWords(newWords);
    localStorage.setItem('hsk3_custom_words', JSON.stringify(newWords));
    HSK3.push(result);
    if (!CHAR_INFO[result.hz[0]]) {
      CHAR_INFO[result.hz[0]] = { radical: result.radical||'—', radicalName: result.radicalName||'—', strokes: result.strokes||0, meaning: result.meaning||'—' };
    }
    onAdded && onAdded(result);
    setHz(''); setResult(null);
    alert(`Đã thêm "${result.hz}" vào danh sách!`);
  };

  const deleteCustom = (idx) => {
    const newWords = customWords.filter((_,i)=>i!==idx);
    setCustomWords(newWords);
    localStorage.setItem('hsk3_custom_words', JSON.stringify(newWords));
    // Remove from HSK3 array
    const widx = HSK3.findIndex(w=>w.hz===customWords[idx].hz);
    if (widx !== -1) HSK3.splice(widx,1);
  };

  return (
    <div className="fade-in">
      <div className="hsk-ghead">
        <button className="hsk-back" onClick={onBack}>← Về</button>
        <div style={{fontFamily:'Noto Serif SC,serif',fontSize:18,fontWeight:500}}>添 Thêm từ</div>
      </div>
      <div style={{background:'var(--paper)',border:'1px solid var(--ink)',boxShadow:'5px 5px 0 var(--ink)',padding:'20px 18px',marginBottom:20}}>
        <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,letterSpacing:'0.2em',opacity:0.55,textTransform:'uppercase',marginBottom:10}}>Nhập chữ Hán</div>
        <div style={{display:'flex',gap:8}}>
          <input
            type="text" placeholder="例: 朋友" value={hz} onChange={e=>setHz(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&lookup()}
            style={{flex:1,padding:'12px 14px',background:'var(--paper)',border:'1px solid var(--ink)',
              fontFamily:'Noto Serif SC,serif',fontSize:22,color:'var(--ink)',outline:'none'}}
          />
          <button onClick={lookup} disabled={loading||!hz.trim()} className="hsk-tsub" style={{width:'auto',marginTop:0,padding:'0 20px',opacity:loading?0.6:1}}>
            {loading ? '…' : 'Tra'}
          </button>
        </div>
        {err && <div style={{marginTop:10,color:'var(--vermilion)',fontStyle:'italic',fontSize:13}}>{err}</div>}
      </div>

      {loading && (
        <div style={{textAlign:'center',padding:32}}>
          <div style={{fontFamily:'Noto Serif SC,serif',fontSize:36,color:'var(--vermilion)',animation:'pulse 1s infinite'}}>{hz}</div>
          <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:10,letterSpacing:'0.2em',marginTop:12,opacity:0.6,textTransform:'uppercase'}}>Đang tra cứu…</div>
        </div>
      )}

      {result && (
        <div className="fade-in" style={{background:'var(--paper)',border:'1px solid var(--ink)',boxShadow:'5px 5px 0 var(--jade)',padding:'20px 18px',marginBottom:16}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:14,paddingBottom:12,borderBottom:'1px solid var(--line)'}}>
            <div>
              <div style={{fontFamily:'Noto Serif SC,serif',fontSize:52,fontWeight:500,lineHeight:1}}>{result.hz}</div>
              <div style={{fontFamily:'Cormorant Garamond,serif',fontStyle:'italic',fontSize:18,color:'var(--vermilion)',marginTop:6}}>{result.py}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:14,fontStyle:'italic',maxWidth:160,lineHeight:1.4}}>{result.vi}</div>
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
            <div style={{background:'var(--paper-deep)',padding:'10px 12px'}}>
              <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,opacity:0.5,textTransform:'uppercase',marginBottom:4}}>Bộ thủ</div>
              <div style={{fontFamily:'Noto Serif SC,serif',fontSize:18,color:'var(--vermilion)'}}>{result.radical}</div>
              <div style={{fontStyle:'italic',fontSize:12,opacity:0.7}}>{result.radicalName}</div>
            </div>
            <div style={{background:'var(--paper-deep)',padding:'10px 12px'}}>
              <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,opacity:0.5,textTransform:'uppercase',marginBottom:4}}>Số nét</div>
              <div style={{fontFamily:'Cormorant Garamond,serif',fontSize:24,fontWeight:600,color:'var(--gold)'}}>{result.strokes}</div>
            </div>
          </div>
          <div style={{fontStyle:'italic',fontSize:13,lineHeight:1.6,marginBottom:10}}>{result.meaning}</div>
          <div style={{borderTop:'1px solid var(--line)',paddingTop:10}}>
            <div style={{fontFamily:'Noto Serif SC,serif',fontSize:15,marginBottom:4}}>{result.ex}</div>
            <div style={{fontStyle:'italic',fontSize:13,opacity:0.7}}>{result.exv}</div>
          </div>
          <button className="hsk-tsub" style={{marginTop:14}} onClick={save}>+ Thêm vào danh sách học</button>
        </div>
      )}

      {customWords.length > 0 && (
        <div>
          <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,letterSpacing:'0.2em',opacity:0.55,textTransform:'uppercase',marginBottom:12,marginTop:8}}>Từ đã thêm ({customWords.length})</div>
          {customWords.map((w,i) => (
            <div key={i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:'var(--paper)',border:'1px solid var(--line)',marginBottom:8}}>
              <div style={{fontFamily:'Noto Serif SC,serif',fontSize:28,fontWeight:500,minWidth:44}}>{w.hz}</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,color:'var(--vermilion)',marginBottom:2}}>{w.py}</div>
                <div style={{fontSize:13,fontStyle:'italic',opacity:0.8}}>{w.vi}</div>
              </div>
              <button onClick={()=>deleteCustom(i)} style={{background:'none',border:'1px solid var(--line)',width:28,height:28,cursor:'pointer',fontSize:14,color:'var(--vermilion)',flexShrink:0}}>×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


function App() {
  const [state, setState] = useState(null);
  const [screen, setScreen] = useState("menu"); // menu|flashcard|quiz|match|typing|done|grammar|search|addword
  const [results, setResults] = useState({ correct: 0, total: 0, xp: 0 });
  const daily = useMemo(() => pickDaily(today()), []);

  useEffect(() => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap';
    document.head.appendChild(link);
    (async () => {
      try {
        const _raw = localStorage.getItem(STORE_KEY); const r = _raw ? {value: _raw} : null;
        const s = r ? JSON.parse(r.value) : { ...defaultState };
        const t = today();
        if (s.lastDay && s.lastDay !== t) {
          const y = new Date(Date.now() - 86400000);
          const yStr = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
          if (s.lastDay !== yStr) s.streak = 0;
        }
        setState(s);
      } catch { setState({ ...defaultState }); }
    })();
  }, []);

  const save = async (s) => { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e) {} };

  const finish = async (correct, total, seenWords) => {
    const xp = Math.round((correct / Math.max(total, 1)) * 25) + correct;
    const t = today();
    const s = { ...state, history: { ...state.history }, wordSeen: { ...(state.wordSeen || {}) } };
    s.totalXP = (s.totalXP || 0) + xp;
    s.totalWords = (s.totalWords || 0) + total;
    if (!s.history[t]) s.history[t] = { games: 0, xp: 0 };
    s.history[t] = { games: s.history[t].games + 1, xp: s.history[t].xp + xp };
    if (s.lastDay !== t) { s.streak = (s.streak || 0) + 1; s.lastDay = t; }
    if (seenWords) seenWords.forEach(hz => { s.wordSeen[hz] = (s.wordSeen[hz] || 0) + 1; });
    setState(s); await save(s);
    setResults({ correct, total, xp });
    setScreen("done");
  };

  const reset = async () => {
    if (!window.confirm("Xóa toàn bộ tiến độ?")) return;
    const s = { ...defaultState };
    setState(s); await save(s);
  };

  if (!state) return <div className="hsk-app"><style>{styles}</style><div style={{padding:40,textAlign:'center',opacity:0.5}}>加载中…</div></div>;

  return (
    <div className="hsk-app">
      <style>{styles}</style>
      {screen === 'menu' && <Menu state={state} onStart={setScreen} onReset={reset} />}
      {screen === 'grammar' && <GrammarScreen onBack={() => setScreen('menu')} />}
      {screen === 'search' && <SearchScreen onBack={() => setScreen('menu')} />}
      {screen === 'addword' && <AddWordScreen onBack={() => setScreen('menu')} onAdded={() => setScreen('menu')} />}
      {screen === 'flashcard' && <Flashcard words={daily} wordSeen={state.wordSeen||{}} onDone={finish} onBack={() => setScreen('menu')} />}
      {screen === 'quiz' && <Quiz words={daily} wordSeen={state.wordSeen||{}} onDone={finish} onBack={() => setScreen('menu')} />}
      {screen === 'match' && <Match words={daily} wordSeen={state.wordSeen||{}} onDone={finish} onBack={() => setScreen('menu')} />}
      {screen === 'typing' && <Typing words={daily} wordSeen={state.wordSeen||{}} onDone={finish} onBack={() => setScreen('menu')} />}
      {screen === 'done' && <Done results={results} state={state} onBack={() => setScreen('menu')} />}
    </div>
  );
}

// ===== TẬP VIẾT VỚI HANZIWRITER =====
function WritingCanvas({ hz }) {
  const containerRef = useRef(null);
  const writerRef = useRef(null);
  const [mode, setMode] = useState('demo'); // demo | practice | quiz
  const [loaded, setLoaded] = useState(false);
  const [err, setErr] = useState(false);
  const [quizResult, setQuizResult] = useState(null); // null | 'ok' | 'no'
  const char = hz[0];

  // Load HanziWriter từ CDN
  useEffect(() => {
    if (window.HanziWriter) { setLoaded(true); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js';
    s.onload = () => setLoaded(true);
    s.onerror = () => setErr(true);
    document.head.appendChild(s);
  }, []);

  // Khởi tạo writer khi loaded hoặc mode/char thay đổi
  useEffect(() => {
    if (!loaded || !containerRef.current) return;
    // Xóa writer cũ
    if (writerRef.current) { try { writerRef.current.cancelQuiz(); } catch(e){} }
    containerRef.current.innerHTML = '';
    setQuizResult(null);

    try {
      const w = window.HanziWriter.create(containerRef.current, char, {
        width: 280, height: 280,
        padding: 20,
        strokeColor: '#1a1814',
        radicalColor: '#c5392b',
        outlineColor: 'rgba(26,24,20,0.12)',
        drawingColor: '#1a1814',
        drawingWidth: 8,
        showCharacter: mode === 'demo',
        showOutline: true,
        strokeAnimationSpeed: 1,
        delayBetweenStrokes: 300,
        highlightOnComplete: true,
        highlightColor: '#4a6b56',
        onLoadCharDataError: () => setErr(true),
      });
      writerRef.current = w;

      if (mode === 'demo') {
        w.loopCharacterAnimation();
      } else if (mode === 'practice') {
        w.animateCharacter();
      } else if (mode === 'quiz') {
        w.quiz({
          onMistake: () => {},
          onCorrectStroke: () => {},
          onComplete: ({ totalMistakes }) => {
            setQuizResult(totalMistakes === 0 ? 'ok' : totalMistakes <= 2 ? 'good' : 'no');
          }
        });
      }
    } catch(e) { setErr(true); }
  }, [loaded, char, mode]);

  // Cleanup khi unmount
  useEffect(() => () => {
    if (writerRef.current) try { writerRef.current.cancelQuiz(); } catch(e) {}
  }, []);

  const modeBtn = (m, label, active) => (
    <button onClick={() => setMode(m)} style={{
      flex:1, padding:'9px 4px',
      background: active ? 'var(--ink)' : 'none',
      color: active ? 'var(--paper)' : 'var(--ink)',
      border:'1px solid var(--line)', borderRight:'none',
      fontFamily:'JetBrains Mono,monospace', fontSize:10,
      letterSpacing:'0.12em', cursor:'pointer', textTransform:'uppercase',
      transition:'all 0.2s'
    }}>{label}</button>
  );

  if (err) return (
    <div style={{textAlign:'center',padding:24,opacity:0.5,fontStyle:'italic'}}>
      Không tải được dữ liệu nét chữ.<br/>Kiểm tra kết nối internet.
    </div>
  );

  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
      {/* Mode selector */}
      <div style={{display:'flex',width:'100%',borderRight:'1px solid var(--line)'}}>
        {modeBtn('demo','▶ Xem mẫu', mode==='demo')}
        {modeBtn('practice','✍ Luyện tập', mode==='practice')}
        {modeBtn('quiz','✓ Kiểm tra', mode==='quiz')}
      </div>

      {/* Mô tả mode */}
      <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,letterSpacing:'0.15em',opacity:0.55,textTransform:'uppercase',textAlign:'center'}}>
        {mode==='demo' && 'Xem thứ tự nét bút — tự động lặp'}
        {mode==='practice' && 'Xem nét mẫu rồi tự viết theo'}
        {mode==='quiz' && 'Tự viết — hệ thống chấm từng nét'}
      </div>

      {/* HanziWriter container — lưới ô Điền */}
      <div style={{
        position:'relative', width:280, height:280,
        border:'1px solid rgba(197,57,43,0.3)',
        background:'var(--paper)',
        flexShrink:0,
        touchAction: mode === 'quiz' ? 'none' : 'auto',
      }}>
        {/* Lưới ô Điền */}
        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}} viewBox="0 0 280 280">
          <line x1="140" y1="0" x2="140" y2="280" stroke="rgba(197,57,43,0.12)" strokeWidth="1"/>
          <line x1="0" y1="140" x2="280" y2="140" stroke="rgba(197,57,43,0.12)" strokeWidth="1"/>
          <line x1="0" y1="0" x2="280" y2="280" stroke="rgba(197,57,43,0.07)" strokeWidth="1"/>
          <line x1="280" y1="0" x2="0" y2="280" stroke="rgba(197,57,43,0.07)" strokeWidth="1"/>
        </svg>
        {!loaded && (
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Noto Serif SC,serif',fontSize:48,opacity:0.15}}>{char}</div>
        )}
        <div ref={containerRef} style={{position:'absolute',inset:0}} />
      </div>

      {/* Kết quả quiz */}
      {mode === 'quiz' && quizResult && (
        <div style={{
          padding:'10px 20px', textAlign:'center',
          background: quizResult==='ok' ? 'var(--jade)' : quizResult==='good' ? 'var(--gold)' : 'var(--vermilion)',
          color:'var(--paper)',
          fontFamily:'Cormorant Garamond,serif', fontSize:16, fontStyle:'italic'
        }}>
          {quizResult==='ok' ? '完美！Không sai nét nào 🎉' : quizResult==='good' ? '很好！Sai 1–2 nét, cố lên!' : '继续！Luyện thêm nhé'}
        </div>
      )}

      {/* Actions */}
      <div style={{display:'flex',gap:10,width:'100%'}}>
        {mode === 'demo' && (
          <button className="hsk-back" style={{flex:1,fontSize:11}} onClick={() => { writerRef.current?.loopCharacterAnimation(); }}>↺ Phát lại</button>
        )}
        {mode === 'practice' && (
          <>
            <button className="hsk-back" style={{flex:1,fontSize:11}} onClick={() => { writerRef.current?.animateCharacter(); }}>▶ Xem lại</button>
            <button className="hsk-back" style={{flex:1,fontSize:11}} onClick={() => { writerRef.current?.reset(); }}>↺ Xóa</button>
          </>
        )}
        {mode === 'quiz' && (
          <button className="hsk-back" style={{flex:1,fontSize:11}} onClick={() => setMode('quiz')}>↺ Thử lại</button>
        )}
      </div>
      <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,opacity:0.4,letterSpacing:'0.12em',textAlign:'center',textTransform:'uppercase'}}>
        Luyện ký tự đầu tiên · {char} · {hz}
      </div>
    </div>
  );
}

function Flashcard({ words, wordSeen, onDone, onBack }) {

    const newOk = ok + (score >= 2 ? 1 : 0);

  const { speak, stop, speaking, supported } = useSpeech();
  const w = words[idx];
  const hidePy = seen[idx] >= PINYIN_THRESHOLD;

  useEffect(() => { stop(); }, [idx]);

  const opts = useMemo(() => {
    const others = shuffle(HSK3.filter(x => x.hz !== w.hz)).slice(0, 3);
    return shuffle([w, ...others]);
  }, [idx]);
  const choose = (opt) => {
    if (pick) return;
    setPick(opt);
    const correct = opt.hz === w.hz;
    const newOk = ok + (correct ? 1 : 0); setOk(newOk);
    // Đọc từ đúng sau khi chọn
    setTimeout(() => speak(w.hz), 200);
    const newSeen = [...seen]; newSeen[idx] = (newSeen[idx] || 0) + 1; setSeen(newSeen);
    setTimeout(() => {
      if (idx+1 >= words.length) onDone(newOk, words.length, words.map(w => w.hz));
      else { setIdx(idx+1); setPick(null); }
    }, 900);
  };
  return (
    <div className="fade-in">
      <GHeader onBack={onBack} idx={idx} total={words.length} />
      <div className="hsk-qq fade-in" key={idx}>
        <div className="hsk-qq-l">Nghĩa của từ này?</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:14}}>
          <div className="hsk-qq-hz">{w.hz}</div>
          {supported && <SpeakBtn text={w.hz} speak={speak} speaking={speaking} />}
        </div>
        {!hidePy && <div className="hsk-qq-py">{w.py}</div>}
        {hidePy && <div className="hsk-qq-py" style={{opacity:0.3,fontSize:13}}>pinyin ẩn · {seen[idx]} lần</div>}
      </div>
      {opts.map((o, i) => {
        let cls = 'hsk-qopt';
        if (pick) { if (o.hz === w.hz) cls += ' ok'; else if (o.hz === pick.hz) cls += ' no'; }
        return (
          <button key={o.hz} className={cls} disabled={!!pick} onClick={() => choose(o)}>
            <span className="lt">{String.fromCharCode(65+i)}</span><span>{o.vi}</span>
          </button>
        );
      })}
    </div>
  );
}

function Match({ words, wordSeen, onDone, onBack }) {
  const BATCH = 5;
  const [batch, setBatch] = useState(0);
  const [sel, setSel] = useState(null);
  const [matched, setMatched] = useState(new Set());
  const [mis, setMis] = useState(null);
  const [ok, setOk] = useState(0);
  const { speak, stop, speaking, supported } = useSpeech();
  const cur = useMemo(() => words.slice(batch*BATCH, batch*BATCH+BATCH), [batch]);
  const tiles = useMemo(() => {
    const h = cur.map(w => ({ id:'h_'+w.hz, type:'hz', w }));
    const m = cur.map(w => ({ id:'m_'+w.hz, type:'me', w }));
    return [...shuffle(h), ...shuffle(m)];
  }, [batch, cur]);
  useEffect(() => {
    if (matched.size === cur.length*2 && cur.length > 0) {
      setTimeout(() => {
        if ((batch+1)*BATCH >= words.length) onDone(ok, words.length, words.map(w => w.hz));
        else { setBatch(batch+1); setMatched(new Set()); setSel(null); }
      }, 700);
    }
  }, [matched]);
  const click = (t) => {
    if (matched.has(t.id) || mis) return;
    if (!sel) { setSel(t); speak(t.w.hz); return; }
    if (sel.id === t.id) { setSel(null); return; }
    if (sel.w.hz === t.w.hz && sel.type !== t.type) {
      const ns = new Set(matched); ns.add(sel.id); ns.add(t.id);
      setMatched(ns); setOk(ok+1); setSel(null);
      speak(t.w.hz); // đọc khi ghép đúng
    } else {
      setMis([sel.id, t.id]);
      setTimeout(() => { setMis(null); setSel(null); }, 600);
    }
  };
  return (
    <div className="fade-in">
      <GHeader onBack={onBack} idx={Math.floor(batch*BATCH + matched.size/2)} total={words.length} />
      <div className="hsk-mtitle">Vòng {batch+1} / {Math.ceil(words.length/BATCH)} · Ghép cặp</div>
      <div className="hsk-mgrid">
        {tiles.map(t => {
          let cls = 'hsk-mtile '+t.type;
          if (matched.has(t.id)) cls += ' match';
          else if (sel && sel.id === t.id) cls += ' sel';
          else if (mis && mis.includes(t.id)) cls += ' mis';
          return (
            <button key={t.id} className={cls} onClick={() => click(t)}>
              {t.type === 'hz'
                ? <div className="w">{t.w.hz}</div>
                : <div>{t.w.vi}</div>}
            </button>
          );
        })}
      </div>
      {supported && <div className="hsk-no-tts" style={{marginTop:12}}>🔊 Chạm ô chữ để nghe phát âm</div>}
    </div>
  );
}

function Typing({ words, wordSeen, onDone, onBack }) {
  const [idx, setIdx] = useState(0);
  const [val, setVal] = useState('');
  const [ok, setOk] = useState(0);
  const [st, setSt] = useState(null);
  const [seen, setSeen] = useState(() => words.map(w => wordSeen[w.hz] || 0));
  const { speak, stop, speaking, supported } = useSpeech();
  const w = words[idx];
  const hidePy = seen[idx] >= PINYIN_THRESHOLD;

  useEffect(() => { stop(); }, [idx]);

  const norm = (s) => s.toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü\s]/g, c => ({'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v',' ':''}[c]||''));
  const submit = () => {
    if (st) return;
    const correct = norm(val.trim()) === norm(w.py);
    const newOk = ok + (correct ? 1 : 0); setOk(newOk);
    const newSeen = [...seen]; newSeen[idx] = (newSeen[idx] || 0) + 1; setSeen(newSeen);
    setSt(correct ? 'ok' : 'no');
    // Đọc từ sau khi trả lời
    setTimeout(() => speak(w.hz), 200);
    setTimeout(() => {
      if (idx+1 >= words.length) onDone(newOk, words.length, words.map(w => w.hz));
      else { setIdx(idx+1); setVal(''); setSt(null); }
    }, 1200);
  };
  const skip = () => {
    const newSeen = [...seen]; newSeen[idx] = (newSeen[idx] || 0) + 1; setSeen(newSeen);
    setSt('no');
    speak(w.hz);
    setTimeout(() => {
      if (idx+1 >= words.length) onDone(ok, words.length, words.map(w => w.hz));
      else { setIdx(idx+1); setVal(''); setSt(null); }
    }, 1200);
  };
  return (
    <div className="fade-in">
      <GHeader onBack={onBack} idx={idx} total={words.length} />
      <div className="hsk-tp fade-in" key={idx}>
        <div className="hsk-tp-l">{hidePy ? 'Gõ pinyin (không có gợi ý)' : 'Gõ pinyin (không cần dấu thanh)'}</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:14,margin:'10px 0 4px'}}>
          <div className="hsk-tp-hz">{w.hz}</div>
          {supported && <SpeakBtn text={w.hz} speak={speak} speaking={speaking} />}
        </div>
        <div className="hsk-tp-vn">{w.vi}</div>
        {!hidePy && !st && <div className="hsk-tp-ans" style={{opacity:0.45}}>Gợi ý: {w.py[0]}...</div>}
        {st && (
          <div style={{marginTop:10,display:'flex',alignItems:'center',justifyContent:'center',gap:16,flexWrap:'wrap'}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,letterSpacing:'0.2em',opacity:0.5,textTransform:'uppercase',marginBottom:4}}>Bạn gõ</div>
              <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:16,color: st==='ok' ? 'var(--jade)' : 'var(--vermilion)',fontWeight:500}}>{val||'—'}</div>
            </div>
            <div style={{fontSize:20,opacity:0.3}}>vs</div>
            <div style={{textAlign:'center'}}>
              <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:9,letterSpacing:'0.2em',opacity:0.5,textTransform:'uppercase',marginBottom:4}}>Đúng là</div>
              <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:16,color:'var(--jade)',fontWeight:500}}>{w.py}</div>
            </div>
          </div>
        )}
        {supported && <button className={"hsk-speak-ex"+(speaking?' active':'')} style={{margin:'10px auto 0',display:'flex'}} onClick={() => speak(w.ex)}>
          <span style={{fontFamily:'Noto Serif SC,serif',fontSize:13}}>{w.ex}</span>
          <span style={{marginLeft:6}}>🔊</span>
        </button>}
      </div>
      <input type="text" className={"hsk-ti"+(st==='ok'?' ok':st==='no'?' no':'')} placeholder="pinyin…" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} autoFocus disabled={!!st} />
      <button className="hsk-tsub" onClick={submit} disabled={!!st}>Kiểm tra</button>
      <button className="hsk-tskip" onClick={skip} disabled={!!st}>Bỏ qua →</button>
    </div>
  );
}

function Done({ results, state, onBack }) {
  const acc = results.total > 0 ? Math.round((results.correct/results.total)*100) : 0;
  const msg = acc >= 90 ? '完美 · Xuất sắc!' : acc >= 70 ? '很好 · Rất tốt!' : acc >= 50 ? '加油 · Cố lên!' : '继续 · Hãy thử lại!';
  return (
    <div className="hsk-done fade-in">
      <div className="hsk-seal">成</div>
      <h2>{msg}</h2>
      <div className="sub">Hoàn thành bài học hôm nay</div>
      <div className="hsk-rgrid">
        <div className="hsk-rcell"><div className="l">Đúng</div><div className="v a">{results.correct}/{results.total}</div></div>
        <div className="hsk-rcell"><div className="l">Chính xác</div><div className="v a">{acc}%</div></div>
        <div className="hsk-rcell"><div className="l">XP nhận</div><div className="v x">+{results.xp}</div></div>
        <div className="hsk-rcell"><div className="l">Streak</div><div className="v x">{state.streak} 🔥</div></div>
      </div>
      <button className="hsk-prim" onClick={onBack}>← Về trang chính</button>
    </div>
  );
}

// Mount
const _root = ReactDOM.createRoot(document.getElementById('root'));
_root.render(React.createElement(App));

</script>
</body>
