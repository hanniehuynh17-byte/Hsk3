<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="HSK 3"/>
<meta name="theme-color" content="#faf7f2"/>
<title>HSK 3 · 每日汉字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --ink:#0f0e0c; --ink2:#1e1c19; --paper:#faf7f2; --paper2:#f0ebe2; --paper3:#e6dfd4;
    --red:#d4341f; --gold:#c49a2e; --teal:#2e6b6b;
    --border:rgba(15,14,12,0.1); --border2:rgba(15,14,12,0.2);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Cormorant Garamond',Georgia,serif; overscroll-behavior:none; }
  #app { min-height:100dvh; max-width:430px; margin:0 auto; }

  /* HERO */
  .hero { background:var(--ink); color:var(--paper); padding:52px 24px 28px; position:relative; overflow:hidden; }
  .hero::before { content:'学'; position:absolute; right:-16px; top:-24px; font-family:'Noto Serif SC',serif;
    font-size:200px; font-weight:700; opacity:0.04; color:var(--paper); line-height:1; pointer-events:none; }
  .hero-eye { color:white; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.25em; text-transform:uppercase; opacity:0.45; margin-bottom:10px; }
  .hero-title { font-family:'Noto Serif SC',serif; font-size:42px; font-weight:700; line-height:1; margin-bottom:6px; color:white; }
  .hero-title .acc { color:var(--red); }
  .hero-sub { font-style:italic; font-size:18px; opacity:0.65; margin-bottom:20px; color:white; }
  .hero-row { display:flex; align-items:center; justify-content:space-between; }
  .hero-date { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em; opacity:0.4; color:white; }
  .streak-pill { display:inline-flex; align-items:center; gap:6px; background:var(--red); color:white;
    padding:6px 14px; border-radius:99px; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; }

  /* STATS */
  .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:18px 18px 0; }
  .stat-card { background:var(--paper2); border-radius:16px; padding:14px 10px; text-align:center; border:1px solid var(--border); }
  .stat-lbl { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; opacity:0.65; margin-bottom:5px; color:var(--ink); }
  .stat-val { font-size:28px; font-weight:600; line-height:1; }
  .stat-val.r { color:var(--red); } .stat-val.g { color:var(--gold); } .stat-val.t { color:var(--teal); }

  /* SECTION */
  .sec-head { display:flex; align-items:center; gap:10px; padding:22px 18px 10px; }
  .sec-lbl { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.25em; text-transform:uppercase; opacity:0.4; white-space:nowrap; }
  .sec-line { flex:1; height:1px; background:var(--border); }

  /* TODAY BANNER */
  .today-banner { margin:4px 18px 0; background:linear-gradient(135deg,var(--teal),#1e4848);
    color:white; border-radius:16px; padding:14px 18px; display:flex; align-items:center; gap:12px; }
  .today-cn { font-family:'Noto Serif SC',serif; font-size:28px; }
  .today-txt { flex:1; font-style:italic; font-size:14px; opacity:0.9; }

  /* MODE CARDS */
  .mode-grid { padding:0 18px; display:flex; flex-direction:column; gap:9px; }
  .mode-card { display:flex; align-items:center; gap:14px; padding:15px 17px; border-radius:16px;
    cursor:pointer; transition:transform 0.15s; border:none; text-align:left; width:100%; font-family:inherit; }
  .mode-card:active { transform:scale(0.98); }
  .mode-card.dark { background:var(--ink2); color:white; } .mode-card.dark * { color:white; }
  .mode-card.light { background:var(--paper2); color:var(--ink); border:1px solid var(--border); }
  .mode-card.accent { background:var(--red); color:white; } .mode-card.accent * { color:white; }
  .mode-card.teal { background:var(--teal); color:white; }
  .mode-card.gold { background:var(--gold); color:white; }
  .mode-icon { font-family:'Noto Serif SC',serif; font-size:30px; line-height:1; width:42px; text-align:center; flex-shrink:0; }
  .mode-info { flex:1; }
  .mode-name { font-family:'Noto Serif SC',serif; font-size:16px; font-weight:500; margin-bottom:3px; }
  .mode-desc { font-size:12px; opacity:0.65; font-style:italic; }
  .mode-arr { font-size:18px; opacity:0.4; flex-shrink:0; }
  .mode-badge { position:absolute; top:9px; right:12px; background:rgba(255,255,255,0.18);
    padding:2px 8px; border-radius:99px; font-family:'JetBrains Mono',monospace; font-size:9px; }

  /* GAME SCREEN - DARK */
  .game-screen { background:var(--ink); color:var(--paper); min-height:100dvh; }
  .game-topbar { display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px 12px; border-bottom:1px solid rgba(255,255,255,0.07); color:white; }
  .game-back { background:rgba(255,255,255,0.08); border:none; color:white !important;
    padding:8px 14px; border-radius:99px; font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:0.12em; cursor:pointer; text-transform:uppercase; }
  .game-prog-txt { font-family:'JetBrains Mono',monospace; font-size:12px; opacity:0.6; letter-spacing:0.1em; color:white; }
  .game-pbar { height:3px; background:rgba(255,255,255,0.08); }
  .game-pfill { height:100%; background:var(--red); transition:width 0.5s cubic-bezier(.2,.8,.2,1); border-radius:0 2px 2px 0; }
  .game-body { padding:20px 20px 80px; }

  /* FLASHCARD */
  .fc-scene { perspective:1600px; margin-bottom:18px; }
  .fc-card { position:relative; height:320px; transform-style:preserve-3d;
    transition:transform 0.7s cubic-bezier(.2,.85,.2,1); cursor:pointer; border-radius:20px; }
  .fc-card.flipped { transform:rotateY(180deg); }
  .fc-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:20px;
    display:flex; flex-direction:column; justify-content:center; align-items:center; padding:28px 22px; }
  .fc-front { background:linear-gradient(145deg,#1e1c19,#2c2925); border:1px solid rgba(255,255,255,0.07); }
  .fc-back { transform:rotateY(180deg); background:linear-gradient(145deg,#9a1e10,#c5392b); border:1px solid rgba(255,255,255,0.1); }
  .fc-corner { position:absolute; top:15px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.2em; opacity:0.5; text-transform:uppercase; color:white; }
  .fc-corner.l { left:16px; } .fc-corner.r { right:16px; }
  .fc-hz { font-family:'Noto Serif SC',serif; font-size:88px; font-weight:500; line-height:1; color:white; }
  .fc-py { font-style:italic; font-size:20px; color:rgba(255,190,160,0.85); margin-top:12px; }
  .fc-hint { position:absolute; bottom:15px; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.2em; opacity:0.32; text-transform:uppercase; color:white; }
  .fc-vn { color:white; font-size:28px; line-height:1.3; text-align:center; margin-bottom:10px; }
  .fc-bpy { font-family:'JetBrains Mono',monospace; font-size:12px; color:rgba(255,220,190,0.65); margin-bottom:14px; }
  .fc-ex { font-family:'Noto Serif SC',serif; font-size:14px; line-height:1.6; text-align:center; opacity:0.8; color:white; padding:0 8px; }
  .fc-exv { font-style:italic; font-size:12px; opacity:0.6; text-align:center; margin-top:4px; color:white; }
  .fc-tabs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:0 0 16px; }
  .fc-tab { padding:9px 4px; border-radius:10px; border:none; font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:0.1em; cursor:pointer; text-transform:uppercase; transition:all 0.2s; }
  .fc-tab.on { background:white; color:var(--ink); }
  .fc-tab.off { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.45); }

  /* RATE BUTTONS */
  .rate-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
  .rate-btn { padding:13px 8px; border-radius:14px; border:none; cursor:pointer; font-family:inherit;
    font-size:14px; color:white; transition:transform 0.15s; text-align:center; }
  .rate-btn:active { transform:scale(0.95); }
  .rate-btn .ic { display:block; font-family:'Noto Serif SC',serif; font-size:22px; margin-bottom:3px; }
  .rate-btn.hard { background:linear-gradient(145deg,#c5392b,#9a2018); }
  .rate-btn.med { background:linear-gradient(145deg,#c49a2e,#9a7818); }
  .rate-btn.easy { background:linear-gradient(145deg,#2e6b6b,#1e4848); }

  /* QUIZ */
  .quiz-q { background:linear-gradient(145deg,#1e1c19,#2c2925); border-radius:20px;
    padding:28px 20px; text-align:center; margin-bottom:16px; border:1px solid rgba(255,255,255,0.06); }
  .quiz-lbl { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.25em;
    text-transform:uppercase; opacity:0.6; color:rgba(255,255,255,0.85); margin-bottom:12px; }
  .quiz-hz { font-family:'Noto Serif SC',serif; font-size:68px; font-weight:500; color:white; line-height:1; }
  .quiz-py { font-style:italic; font-size:17px; color:rgba(255,190,160,0.8); margin-top:8px; }
  .quiz-opts { display:flex; flex-direction:column; gap:8px; }
  .quiz-opt { padding:14px 17px; border-radius:14px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.09); color:var(--paper); font-family:inherit; font-size:16px;
    text-align:left; cursor:pointer; transition:all 0.18s; display:flex; align-items:center; gap:12px; width:100%; }
  .quiz-opt:active:not(:disabled) { transform:scale(0.98); }
  .quiz-opt .lt { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--red);
    background:rgba(212,52,31,0.15); width:26px; height:26px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .quiz-opt.ok { background:rgba(46,107,107,0.28); border-color:var(--teal); }
  .quiz-opt.ok .lt { background:var(--teal); color:white; }
  .quiz-opt.no { background:rgba(212,52,31,0.22); border-color:var(--red); }
  .quiz-opt.no .lt { background:var(--red); color:white; }

  /* MATCH */
  .match-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .match-tile { padding:14px 10px; border-radius:14px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.09); cursor:pointer; min-height:76px; display:flex;
    flex-direction:column; align-items:center; justify-content:center; text-align:center;
    font-family:inherit; color:var(--paper); transition:all 0.18s; }
  .match-tile.hz .w { font-family:'Noto Serif SC',serif; font-size:26px; font-weight:500; }
  .match-tile.me { font-size:13px; font-style:italic; }
  .match-tile.sel { background:rgba(212,52,31,0.28); border-color:var(--red); transform:scale(0.97); }
  .match-tile.match { background:rgba(46,107,107,0.28); border-color:var(--teal); opacity:0.55; pointer-events:none; }
  .match-tile.mis { animation:shake 0.4s; background:rgba(212,52,31,0.22); border-color:var(--red); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  /* TYPING */
  .type-prompt { background:linear-gradient(145deg,#1e1c19,#2c2925); border-radius:20px;
    padding:24px 20px; margin-bottom:14px; text-align:center; border:1px solid rgba(255,255,255,0.06); }
  .type-lbl { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.25em;
    text-transform:uppercase; opacity:0.6; color:rgba(255,255,255,0.85); margin-bottom:10px; }
  .type-hz { font-family:'Noto Serif SC',serif; font-size:64px; font-weight:500; color:white; line-height:1; margin:8px 0 6px; }
  .type-vn { font-style:italic; font-size:19px; color:rgba(255,255,255,0.72); }
  .type-ans { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); margin-top:8px; }
  .type-input { width:100%; padding:17px; border-radius:16px; background:rgba(255,255,255,0.08);
    border:1.5px solid rgba(255,255,255,0.14); color:white; font-family:'Noto Serif SC',serif;
    font-size:28px; text-align:center; outline:none; transition:all 0.2s; margin-bottom:9px; }
  .type-input::placeholder { opacity:0.28; color:white; }
  .type-input:focus { border-color:var(--red); background:rgba(212,52,31,0.1); }
  .type-input.ok { background:rgba(46,107,107,0.28); border-color:var(--teal); }
  .type-input.no { background:rgba(212,52,31,0.2); border-color:var(--red); animation:shake 0.4s; }

  /* BUTTONS */
  .btn-p { width:100%; padding:15px; border-radius:14px; background:var(--red); color:white; border:none;
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.2em; text-transform:uppercase;
    cursor:pointer; transition:all 0.18s; margin-bottom:8px; }
  .btn-p:active { transform:scale(0.98); } .btn-p:disabled { opacity:0.4; cursor:default; }
  .btn-s { width:100%; padding:13px; border-radius:14px; background:rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.65); border:1px solid rgba(255,255,255,0.11);
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.15em;
    text-transform:uppercase; cursor:pointer; transition:all 0.18s; margin-bottom:8px; }
  .btn-s:disabled { opacity:0.35; }

  /* SPEAK */
  .speak-btn { background:rgba(255,255,255,0.09); border:1px solid rgba(255,255,255,0.13);
    border-radius:99px; color:var(--ink); width:40px; height:40px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:16px; transition:all 0.2s; flex-shrink:0; }
  .speak-btn.active { background:var(--red); border-color:var(--red); animation:pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .game-screen .speak-btn, .type-prompt .speak-btn { background:rgba(255,255,255,0.12) !important; border-color:rgba(255,255,255,0.2) !important; color:white !important; }
  .speak-btn.active { background:var(--red) !important; color:white !important; }
  .speak-row { display:flex; justify-content:center; align-items:center; gap:10px; margin:13px 0 2px; }
  .speak-ex { display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:99px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.11);
    color:rgba(255,255,255,0.72); cursor:pointer; font-family:inherit; font-size:13px; }

  /* COMPLETE */
  .done-screen { background:var(--ink); min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:40px 24px; text-align:center; }
  .done-seal { font-family:'Noto Serif SC',serif; font-size:72px; color:var(--red);
    border:4px solid var(--red); width:120px; height:120px; border-radius:24px; display:flex;
    align-items:center; justify-content:center; margin:0 auto 20px; transform:rotate(-4deg);
    box-shadow:0 0 40px rgba(212,52,31,0.25); }
  .done-msg { font-size:32px; font-weight:600; color:white !important; margin-bottom:8px; }
  .done-sub { font-style:italic; font-size:16px; color:rgba(255,255,255,0.7) !important; margin-bottom:28px; }
  .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; margin-bottom:22px; }
  .result-cell { background:rgba(255,255,255,0.06); border-radius:14px; padding:14px; border:1px solid rgba(255,255,255,0.08); }
  .result-cell .l { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.2em;
    text-transform:uppercase; color:rgba(255,255,255,0.65) !important; margin-bottom:4px; }
  .result-cell .v { font-size:26px; font-weight:600; color:white !important; }
  .result-cell .v.g { color:#5aaa7a; } .result-cell .v.r { color:var(--red); }

  /* TOOL SCREENS (light) */
  .tool-head { background:var(--ink); color:white; padding:52px 20px 20px; } .tool-head *, .tool-title, .tool-sub { color:white; }
  .tool-back { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1);
    border:none; color:white; padding:8px 14px; border-radius:99px; font-family:'JetBrains Mono',monospace;
    font-size:11px; cursor:pointer; margin-bottom:12px; letter-spacing:0.12em; text-transform:uppercase; }
  .tool-title { font-family:'Noto Serif SC',serif; font-size:26px; font-weight:700; margin-bottom:4px; }
  .tool-sub { font-style:italic; font-size:14px; opacity:0.55; }
  .tool-body { padding:18px; background:var(--paper); min-height:60vh; }
  .search-inp { width:100%; padding:13px 17px; border-radius:14px; background:var(--paper2);
    border:1.5px solid var(--border2); font-family:'Noto Serif SC',serif; font-size:18px;
    color:var(--ink); outline:none; transition:border-color 0.2s; box-sizing:border-box; margin-bottom:14px; }
  .search-inp:focus { border-color:var(--red); }
  .word-row { display:flex; align-items:center; gap:13px; padding:13px 15px; background:var(--paper2);
    border-radius:14px; margin-bottom:8px; cursor:pointer; border:1px solid var(--border); transition:all 0.16s; }
  .word-row:active { transform:scale(0.98); }
  .word-row-hz { font-family:'Noto Serif SC',serif; font-size:30px; font-weight:500; min-width:50px; }
  .word-row-py { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--red); margin-bottom:2px; }
  .word-row-vi { font-size:13px; font-style:italic; opacity:0.7; }
  .grammar-item { background:var(--paper2); border-radius:14px; padding:14px 15px; margin-bottom:8px;
    cursor:pointer; border:1px solid var(--border); border-left:4px solid var(--red); transition:all 0.16s; }
  .grammar-item:active { transform:scale(0.98); }
  .grammar-num { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--red); opacity:0.6; margin-bottom:3px; }
  .grammar-title { font-family:'Noto Serif SC',serif; font-size:15px; font-weight:500; margin-bottom:5px; }
  .grammar-pat { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold);
    background:rgba(196,154,46,0.1); padding:3px 8px; border-radius:6px; display:inline-block; }
  .lesson-item { display:flex; align-items:center; gap:13px; padding:13px 15px; background:var(--paper2);
    border-radius:14px; margin-bottom:8px; cursor:pointer; border:1px solid var(--border);
    border-left:4px solid var(--red); transition:all 0.16s; }
  .lesson-item:active { transform:scale(0.98); }
  .lesson-num { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:32px;
    color:var(--red); min-width:36px; line-height:1; }
  .lesson-pbar { height:3px; background:var(--border); border-radius:2px; margin-top:5px; overflow:hidden; }
  .lesson-pfill { height:100%; border-radius:2px; transition:width 0.3s; }

  /* EXPLAIN TAB */
  .exp-card { background:linear-gradient(145deg,#1e1c19,#2c2925); border-radius:20px; padding:20px 18px;
    border:1px solid rgba(255,255,255,0.07); color:white; } .exp-card, .exp-card * { color:white; } .exp-card .exp-py { color:rgba(255,190,160,0.9) !important; }
  .exp-top { display:flex; justify-content:space-between; align-items:flex-start;
    padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.08); }
  .exp-hz { font-family:'Noto Serif SC',serif; font-size:52px; font-weight:500; line-height:1; }
  .exp-py { font-style:italic; font-size:18px; color:rgba(255,190,160,0.85); margin-top:6px; }
  .exp-vi { font-size:13px; font-style:italic; opacity:0.65; text-align:right; max-width:150px; line-height:1.4; }
  .exp-chips { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:13px; }
  .exp-chip { background:rgba(255,255,255,0.06); border-radius:12px; padding:10px 12px; border:1px solid rgba(255,255,255,0.08); }
  .exp-chip-lbl { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.15em; text-transform:uppercase; opacity:0.4; margin-bottom:3px; }
  .exp-chip-val { font-size:18px; font-weight:500; }
  .exp-chip-sub { font-style:italic; font-size:11px; opacity:0.55; margin-top:2px; }
  .exp-meaning { font-style:italic; font-size:14px; line-height:1.7; opacity:0.78; margin-bottom:13px; }
  .exp-ex { background:rgba(255,255,255,0.04); border-radius:12px; padding:12px 13px; border-left:3px solid var(--red); }
  .exp-ex-lbl { font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; opacity:0.38; margin-bottom:5px; }

const READINGS = [
  { lesson:1, title:"小明的周末计划", text:"小明这个周末有很多打算。他想去爬山，还打算带地图去北方的公园。妈妈让他先把作业写完，他说早就写好了，一点儿也不着急。朋友小刚也想跟他一起去，他们准备带面包和水，好好玩儿一天。", translation:"Tiểu Minh có nhiều dự định cho cuối tuần này. Anh ấy muốn đi leo núi, và còn dự định mang bản đồ đến công viên phía bắc. Mẹ bảo làm xong bài tập trước, anh ấy nói đã xong từ lâu rồi, không chút lo lắng. Bạn Tiểu Cương cũng muốn đi cùng, họ chuẩn bị mang bánh mì và nước, vui chơi cả ngày." },
  { lesson:2, title:"办公室里的故事", text:"王老师的办公室在二楼。他每天很早就来，从不迟到。他的腿有一点儿不舒服，走路慢一些，但每天都坚持来。同事们都觉得他非常认真，大家很容易就和他成为朋友。", translation:"Văn phòng của thầy Vương ở tầng hai. Mỗi ngày ông đến rất sớm, không bao giờ đến muộn. Chân ông hơi không thoải mái, đi chậm hơn một chút, nhưng mỗi ngày vẫn kiên trì đến. Các đồng nghiệp đều thấy ông rất nghiêm túc, mọi người rất dễ trở thành bạn với ông." },
  { lesson:3, title:"桌子上的饮料", text:"桌子上放着很多饮料。有新鲜的果汁，还是有绿茶好喝？妈妈买了面包和饮料，她说冰箱里还有一些水果。弟弟想喝啤酒，妈妈说他还小，只能喝果汁。爸爸笑着说，那就喝茶吧，对身体好。", translation:"Trên bàn có rất nhiều đồ uống. Có nước trái cây tươi, hay là trà xanh ngon hơn? Mẹ mua bánh mì và đồ uống, bà nói trong tủ lạnh còn có trái cây. Em trai muốn uống bia, mẹ nói con còn nhỏ, chỉ được uống nước trái cây. Bố cười bảo, vậy thì uống trà đi, tốt cho sức khỏe." },
  { lesson:4, title:"热情的服务员", text:"这家超市的服务员非常热情，总是笑着跟客人说话。她年轻又努力，工作态度很好。一位客人问她蛋糕在哪里，她马上带客人去找。客人满意地点了点头，说这里的服务真好。", translation:"Nhân viên phục vụ của siêu thị này rất nhiệt tình, luôn cười và nói chuyện với khách. Cô ấy trẻ và chăm chỉ, thái độ làm việc rất tốt. Một vị khách hỏi bánh kem ở đâu, cô ấy ngay lập tức dẫn khách đi tìm. Vị khách hài lòng gật đầu, nói dịch vụ ở đây thật tốt." },
  { lesson:5, title:"越来越胖了", text:"最近李明越来越胖了。医生说他应该多锻炼，少吃甜食。他感冒好了以后，开始每天早上跑步。裤子越来越小了。妈妈照顾他，当然也希望他健康。他说，一定要坚持，不能着急。", translation:"Dạo này Lý Minh ngày càng béo ra. Bác sĩ nói nên tập thể dục nhiều hơn, ăn ít đồ ngọt. Sau khi khỏi cảm cúm, anh ấy bắt đầu chạy bộ mỗi sáng. Quần ngày càng chật ra. Mẹ chăm sóc anh ấy, tất nhiên cũng mong anh ấy khỏe mạnh. Anh ấy nói, nhất định phải kiên trì, không được vội vàng." },
  { lesson:6, title:"找不到眼镜", text:"张先生突然找不到他的眼镜了。他刚才还放在桌上的，怎么就不见了？他着急地在房间里找，终于在书包里找到了。原来他自己放进去，又忘记了。他明白了，以后要记得放在固定的地方。", translation:"Ông Trương đột nhiên không tìm thấy kính. Vừa mới đặt trên bàn, sao lại mất rồi? Ông vội vàng tìm trong phòng, cuối cùng tìm thấy trong cặp sách. Hóa ra tự mình bỏ vào, rồi lại quên mất. Ông hiểu rồi, sau này phải nhớ để ở chỗ cố định." },
  { lesson:7, title:"认识五年了", text:"王芳和李静认识已经五年了。她们是大学同学，毕业以后在同一家银行工作。王芳对音乐感兴趣，常常下班以后去学吉他。李静对旅游感兴趣，刚才还在查旅游信息。两个人的爱好不一样，但是感情很好。", translation:"Vương Phương và Lý Tĩnh đã quen nhau được năm năm. Họ là bạn học đại học, sau khi tốt nghiệp làm tại cùng một ngân hàng. Vương Phương có hứng thú với âm nhạc, thường sau giờ làm đi học đàn. Lý Tĩnh có hứng thú với du lịch, vừa mới tra thông tin du lịch. Sở thích khác nhau, nhưng tình cảm rất tốt." },
  { lesson:8, title:"你去哪儿我就去哪儿", text:"王明对太太说：你去哪儿，我就去哪儿。太太笑了，说：那你跟我去买衣服吧。王明不太满意，但是还是跟着去了。在商店里，他看到电梯旁边有一家咖啡店，高兴地说：买完衣服，我们去喝咖啡吧，那里又安静又舒服。", translation:"Vương Minh nói với vợ: Em đi đâu anh đi đó. Vợ cười bảo: Vậy anh đi mua quần áo với em nhé. Vương Minh không mấy vui, nhưng vẫn đi theo. Trong cửa hàng, nhìn thấy bên cạnh thang máy có quán cà phê, vui vẻ nói: Mua xong quần áo, mình đi uống cà phê nhé, chỗ đó vừa yên tĩnh vừa thoải mái." },
  { lesson:9, title:"她的汉语很好", text:"林美是越南人，但是她的汉语说得跟中国人一样好。她来中国留学已经三年了，每天都练习听说读写。她参加了学校的汉语比赛，得了第一名。老师说，她进步很快，因为她非常努力。", translation:"Lâm Mỹ là người Việt Nam, nhưng tiếng Trung nói hay như người Trung Quốc vậy. Cô ấy du học ở Trung Quốc đã ba năm, mỗi ngày đều luyện tập nghe nói đọc viết. Cô ấy tham gia cuộc thi tiếng Trung của trường, đạt giải nhất. Giáo viên nói, cô ấy tiến bộ rất nhanh, vì rất cố gắng." },
  { lesson:10, title:"数学比历史难多了", text:"小红觉得数学比历史难多了。历史只要记住事件就可以，数学要真正理解才行。她找了一个数学很厉害的同学做家教。附近的图书馆环境很好，她们经常在那里一起学习，互相帮助。", translation:"Tiểu Hồng thấy toán học khó hơn lịch sử rất nhiều. Lịch sử chỉ cần nhớ sự kiện là được, toán học phải thực sự hiểu. Cô ấy tìm một bạn học giỏi toán để kèm học. Thư viện gần đó môi trường rất tốt, họ thường đến đó cùng học, giúp đỡ nhau." },
  { lesson:11, title:"别忘了关空调", text:"妈妈出门前对儿子说：别忘了把空调关了，把灯也关掉。儿子说：知道了，冰箱里的饮料我也不会乱喝。妈妈又说：笔记本电脑记得充电，养成好习惯。儿子笑了：妈，你放心吧，这些事情我都会做好的。", translation:"Trước khi ra ngoài, mẹ nói với con trai: Đừng quên tắt máy điều hòa, tắt đèn đi. Con trai nói: Con biết rồi, đồ uống trong tủ lạnh con cũng không uống bừa. Mẹ lại nói: Nhớ sạc pin laptop, hãy tập thói quen tốt. Con trai cười: Mẹ yên tâm đi, những việc này con đều sẽ làm tốt." },
  { lesson:12, title:"把重要的东西放好", text:"小李要去机场，司机在楼下等了。他把护照、行李箱放在门口，突然发现钱包不见了。他生气地找了很久，最后发现钱包就在行李箱里，是自己放进去又忘了。他对自己说：以后一定要把重要的东西放好。", translation:"Tiểu Lý chuẩn bị đi sân bay, tài xế đã đợi dưới lầu. Anh ấy đặt hộ chiếu và vali ở cửa, bỗng phát hiện ví không thấy đâu. Tức giận tìm rất lâu, cuối cùng phát hiện ví trong vali, tự bỏ vào rồi lại quên. Anh ấy tự nhủ: Sau này nhất định phải để những thứ quan trọng cho cẩn thận." },
  { lesson:13, title:"我是走回来的", text:"爷爷问孙子：你是坐车回来的吗？孙子说：不是，我是走回来的，走了一个小时。爷爷说：走路对身体好，终于到家了吧。孙子笑了。爷爷说：一般来说，要养成经常走路的习惯，对健康有好处。", translation:"Ông hỏi cháu: Con đi xe về à? Cháu nói: Không, con đi bộ về, đi bộ mất một tiếng. Ông nói: Đi bộ tốt cho sức khỏe, cuối cùng về đến nhà rồi nhỉ. Cháu cười. Ông bảo: Nói chung, hãy tập thói quen đi bộ thường xuyên, tốt cho sức khỏe." },
  { lesson:14, title:"把水果拿过来", text:"阿姨让我把水果从冰箱里拿出来，放在盘子里。然后让我先打扫干净厨房，再来帮她准备节日的食物。她说今年节日叔叔一家都会来，大家一起吃饭很热闹。我高兴地答应了，顺便把香蕉也洗好了。", translation:"Cô bảo tôi lấy hoa quả ra từ tủ lạnh, đặt vào đĩa. Sau đó bảo tôi quét dọn bếp sạch trước, rồi mới đến giúp cô chuẩn bị thức ăn ngày lễ. Cô nói năm nay ngày lễ, gia đình chú đều sẽ đến, mọi người ăn cơm cùng nhau rất vui. Tôi vui vẻ nhận lời, tiện thể rửa chuối luôn." },
  { lesson:15, title:"留学的故事", text:"小云去中国留学，除了语言不同以外，其他方面都很容易适应。她每天上网查新闻，提高自己的汉语水平。她参加了学校的文化节目，认识了很多世界各地的朋友。她说，这次留学让她开阔了眼界，学到了很多。", translation:"Tiểu Vân đi du học ở Trung Quốc, ngoài ngôn ngữ khác ra, các mặt khác đều rất dễ thích nghi. Mỗi ngày lên mạng tra tin tức, nâng cao trình độ tiếng Trung. Tham gia chương trình văn hóa của trường, làm quen được nhiều bạn bè từ khắp nơi trên thế giới. Cô ấy nói, lần du học này giúp mở mang tầm mắt, học được rất nhiều." },
  { lesson:16, title:"城市生活", text:"大城市的生活节奏快，李云在城市里工作。她觉得城市里别人的关系比较复杂。最近她越来越想回到家乡，那里空气新鲜，生活简单，邻居关系也好。她说，城市有城市的好，家乡有家乡的好，两个地方她都喜欢。", translation:"Nhịp sống ở thành phố lớn nhanh, Lý Vân làm việc ở thành phố. Cô ấy thấy quan hệ giữa người với người ở thành phố khá phức tạp. Gần đây ngày càng muốn về quê nhà, nơi đó không khí trong lành, cuộc sống đơn giản, quan hệ hàng xóm cũng tốt. Cô ấy nói, thành phố có cái hay của thành phố, quê nhà có cái hay của quê nhà, cả hai nơi cô ấy đều thích." },
  { lesson:17, title:"治好你的病", text:"张医生说，治好一种病，除了药以外，心情也很重要。他让病人必须按时吃药，根据情况调整。病人问：一共要多久？医生说，每个人情况不同，一般需要一段时间。最重要的是要有信心，保持好心情。", translation:"Bác sĩ Trương nói, chữa khỏi bệnh, ngoài thuốc ra, tâm trạng cũng rất quan trọng. Ông bảo bệnh nhân phải uống thuốc đúng giờ, điều chỉnh theo tình hình. Bệnh nhân hỏi: Tổng cộng mất bao lâu? Bác sĩ nói, mỗi người khác nhau, nói chung cần một khoảng thời gian. Quan trọng nhất là phải có niềm tin, giữ tâm trạng tốt." },
  { lesson:18, title:"我相信他们会同意", text:"小王相信他的提议大家会同意。关于这个新计划，他已经想了很久了。他觉得，只要大家团结，就一定能成功。他不但喜欢动物，而且对环境保护很感兴趣。动物园的熊猫有名得不得了，吸引了很多国家的游客。", translation:"Tiểu Vương tin mọi người sẽ đồng ý với đề xuất của anh ấy. Về kế hoạch mới này, anh ấy đã nghĩ rất lâu. Anh ấy thấy, chỉ cần mọi người đoàn kết, nhất định sẽ thành công. Anh ấy không những thích động vật, mà còn có hứng thú với bảo vệ môi trường. Gấu trúc trong vườn thú rất nổi tiếng, thu hút du khách từ nhiều quốc gia." },
  { lesson:19, title:"你没看出来吗", text:"画家张先生画了一幅画，画里有蓝色的天空和几只小鸟。一位朋友看了半天，没看出来那些是马还是鸟。张先生哭笑不得，说：那明明是鸟啊！朋友摸了摸耳朵说：你别生气，我的眼睛不太好，经常看错。", translation:"Họa sĩ ông Trương vẽ một bức tranh, trong tranh có bầu trời xanh và vài con chim. Một người bạn nhìn mãi không ra đó là ngựa hay chim. Ông Trương dở khóc dở cười bảo: Rõ ràng là chim mà! Người bạn sờ tai bảo: Ông đừng tức, mắt tôi không tốt lắm, thường hay nhìn nhầm." },
  { lesson:20, title:"被他影响了", text:"小红说，她的生活被同学李明影响了很多。以前她很少运动，现在每天早上都锻炼身体。她说，只有坚持锻炼，才能保持健康。她也开始关心环境保护。她觉得，被好朋友正面影响，是一件非常幸运的事。", translation:"Tiểu Hồng nói, cuộc sống của cô ấy bị ảnh hưởng rất nhiều bởi bạn học Lý Minh. Trước đây ít tập thể dục, bây giờ mỗi sáng đều rèn luyện. Cô ấy nói, chỉ có kiên trì luyện tập, mới giữ được sức khỏe. Cô ấy cũng bắt đầu quan tâm đến bảo vệ môi trường. Cô ấy thấy, bị ảnh hưởng tích cực bởi người bạn tốt, là điều rất may mắn." },

  },
  7: {

      { title:"认识多久了", lines:[

        {s:"A",t:"你们感情真好。"}]},
      { title:"约时间见面", lines:[

        {s:"A",t:"哎呀，都这么晚了，我要迟到了！"},{s:"B",t:"你的会议几点开始？"},
        {s:"A",t:"两点半，我已经迟到了半个小时了！"}]}

  },
  8: {

        {s:"A",t:"你刚才说你去哪儿我就去哪儿！"},{s:"B",t:"我是说，除了爬山哪儿都行。"}]},
      { title:"在商场", lines:[
        {s:"A",t:"这个商场又大又好，你再去哪儿买东西我就跟你去哪儿。"},{s:"B",t:"真的吗？那我去买衣服。"},
        {s:"A",t:"我不想去那层，能不能去别的地方？"},{s:"B",t:"你刚才答应我的！"},
        {s:"A",t:"好，我们一起去，不过先去喝杯咖啡怎么样？"}]},
      { title:"邀请朋友", lines:[
        {s:"A",t:"你周末有什么打算？"},{s:"B",t:"还没想好，你呢？"},

        {s:"A",t:"好，我们早点儿去，人少，更容易看到熊猫。"}]},
      { title:"换工作", lines:[
        {s:"A",t:"你最近看起来不太高兴，怎么了？"},{s:"B",t:"我想换工作，但是不知道去哪儿好。"},
        {s:"A",t:"你对什么感兴趣？"},{s:"B",t:"我对设计感兴趣，但是我没有经验。"},
        {s:"A",t:"没关系，你可以先去学，重要的是要有信心。"}]}
    ],
    proverb:{cn:"站得高，看得远",py:"Zhàn de gāo, kàn de yuǎn",vi:"Đứng càng cao, nhìn càng xa.",meaning:"Tầm nhìn rộng hơn khi đứng ở vị trí cao — người có kiến thức cao thì nhìn xa trông rộng."}
  },
  9: {

        {s:"A",t:"难怪！努力就一定有收获。"}]},
      { title:"学语言的方法", lines:[
        {s:"A",t:"你学汉语多久了？"},{s:"B",t:"学了三年了，但还是说得不太好。"},

    proverb:{cn:"三人行，必有我师",py:"Sān rén xíng, bì yǒu wǒ shī",vi:"Ba người cùng đi, ắt có người là thầy ta.",meaning:"Trong mọi người xung quanh đều có điều ta có thể học hỏi."}
  },

  17: {

// ===== STATE & STORAGE =====
const STORE_KEY = 'hsk3_v6';
const PINYIN_THRESHOLD = 10;
const DAILY_COUNT = 20;

let appState = {
  streak: 0, lastDay: null, totalXP: 0, totalWords: 0,
  history: {}, wordSeen: {}
};

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    const t = today();
    if (s.lastDay && s.lastDay !== t) {
      const y = new Date(Date.now() - 86400000);
      const yStr = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
      if (s.lastDay !== yStr) s.streak = 0;
    }
    appState = { ...appState, ...s };
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(appState)); } catch(e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDaily() {
  const seed = today();
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) & 0xffffffff;
  const arr = HSK3.map((w, i) => ({ w, k: Math.abs(Math.sin(h + i * 9301)) }));
  arr.sort((a, b) => a.k - b.k);
  return arr.slice(0, DAILY_COUNT).map(x => x.w);
}

function getCharInfo(hz) {
  const first = hz[0];
  return CHAR_INFO[first] || { radical:'—', radicalName:'—', strokes:'—', meaning:'Chưa có thông tin' };
}

// ===== SPEECH =====
let speaking = false;
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const zh = voices.find(v => v.lang.startsWith('zh'));
  if (zh) u.voice = zh;
  u.onstart = () => { speaking = true; };
  u.onend = u.onerror = () => { speaking = false; };
  window.speechSynthesis.speak(u);
}

function segmentText(text) {
  const segs = [];
  let i = 0;
  while (i < text.length) {
    const ch = text[i];
    if (/[，。！？、：；""''（）【】\s…—]/.test(ch)) {
      segs.push({ type:'punct', text:ch });
      i++; continue;
    }
    let matched = false;
    for (let len = 4; len >= 2; len--) {
      const slice = text.slice(i, i+len);
      const found = HSK3.find(w => w.hz === slice);
      if (found) { segs.push({ type:'word', text:slice, word:found }); i+=len; matched=true; break; }
    }
    if (!matched) {
      const found = HSK3.find(w => w.hz === ch);
      segs.push({ type: found?'word':'char', text:ch, word:found||null });
      i++;
    }
  }
  return segs;
}

// ===== EVENTS =====
// Single global delegation — handles all clicks regardless of re-renders
function initGlobalEvents() {
  document.addEventListener('click', (e) => {
    // data-nav
    const nav = e.target.closest('[data-nav]');
    if (nav) {
      const v = nav.dataset.nav;
      if (v === 'flashcard') initFlashcard();
      else if (v === 'quiz') initQuiz();
      else if (v === 'match') initMatch();
      else if (v === 'typing') initTyping();
      else navigate(v);
      return;
    }
    // data-action
    const act = e.target.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      const l = screenData.lesson;
      if (a === 'lesson-vocab') initLessonVocab(l);
      else if (a === 'lesson-dialogue') navigate('lesson_dialogue', { lesson: l, dialogIdx: 0 });
      else if (a === 'lesson-reading') navigate('lesson_reading', { lesson: l });
      else if (a === 'lesson-exercise') initLessonExercise(l);
      else if (a === 'lesson-back') navigate('lesson_detail', { lesson: l });
      return;
    }
    // data-lesson
    const les = e.target.closest('[data-lesson]');
    if (les) {
      const lesson = LESSON_MAP.find(l => l.id == les.dataset.lesson);
      if (lesson) navigate('lesson_detail', { lesson });
      return;
    }
    // data-gidx
    const gi = e.target.closest('[data-gidx]');
    if (gi) { navigate('grammar_detail', { grammar: HSK3_GRAMMAR[+gi.dataset.gidx] }); return; }
    // data-rate
    const rt = e.target.closest('[data-rate]');
    if (rt) { advanceFlashcard(+rt.dataset.rate); return; }
    // data-tile
    const ti = e.target.closest('[data-tile]');
    if (ti) { handleMatchTile(ti.dataset.tile); return; }
    // data-pick
    const pk = e.target.closest('[data-pick]');
    if (pk) {
      if (screenData.picked) return;
      screenData.picked = pk.dataset.pick;
      const w = screenData.words[screenData.idx];
      if (screenData.picked === w.hz) screenData.ok++;
      screenData.seen[screenData.idx] = (screenData.seen[screenData.idx]||0)+1;
      appState.wordSeen[w.hz] = (appState.wordSeen[w.hz]||0)+1;
      render();
      setTimeout(() => speak(w.hz), 200);
      setTimeout(() => advanceWord('quiz'), 900);
      return;
    }
    // data-del
    const dl = e.target.closest('[data-del]');
    if (dl) {
      const custom = JSON.parse(localStorage.getItem('hsk3_custom')||'[]');
      custom.splice(+dl.dataset.del, 1);
      localStorage.setItem('hsk3_custom', JSON.stringify(custom));
      navigate('addword');
      return;
    }
    // data-back-word
    const bw = e.target.closest('[data-back-word]');
    if (bw) { navigate(screenData.from || 'search', {}); return; }
    // data-wrd (search results)
    const wr = e.target.closest('[data-wrd]');
    if (wr) {
      const hz = decodeURIComponent(wr.dataset.wrd);
      const word = HSK3.find(w => w.hz === hz);
      if (word) navigate('word_detail', { word, from:'search' });
      return;
    }
    // data-didx (dialogue tab)
    const di = e.target.closest('[data-didx]');
    if (di) {
      navigate('lesson_dialogue', { lesson: screenData.lesson, dialogIdx: +di.dataset.didx });
      return;
    }
    // data-extab (exercise tabs)
    const et = e.target.closest('[data-extab]');
    if (et) { screenData.exTab = et.dataset.extab; render(); return; }
    // data-tab (flashcard tabs)
    const ft = e.target.closest('[data-tab]');
    if (ft) { screenData.tab = ft.dataset.tab; screenData.flipped = false; render(); initHanziWriter(); return; }
    // data-speak
    const spk = e.target.closest('[data-speak]');
    if (spk) { speak(spk.dataset.speak); return; }
    // data-addwrd (add word from search)
    const aw = e.target.closest('[data-addwrd]');
    if (aw) { addToList(aw.dataset.addwrd); return; }
    // data-closepopup
    const cp = e.target.closest('[data-closepopup]');
    if (cp) { const p=document.getElementById('wordPopup'); if(p)p.style.display='none'; return; }
    // reading word popup
    const rw = e.target.closest('.reading-word');
    if (rw) { handleReadingWord(e, rw); return; }
    // close popup on outside click
    const popup = document.getElementById('wordPopup');
    if (popup && !popup.contains(e.target)) popup.style.display = 'none';
  });

  // Input events (cannot be delegated easily)
  document.addEventListener('input', (e) => {
    // blank inputs
    const bi = e.target.closest('[data-bidx]');
    if (bi) {
      if (!screenData.blankAnswers) screenData.blankAnswers = (screenData.exercises[screenData.idx].blanks||[]).map(()=>'');
      screenData.blankAnswers[+bi.dataset.bidx] = e.target.value;
      return;
    }
    if (e.target.id === 'typeInput') { screenData.val = e.target.value; return; }
    if (e.target.id === 'exInput') { screenData.answer = e.target.value; return; }
    if (e.target.id === 'addInput') return;
    if (e.target.id === 'addSearchInput') {
      const q = e.target.value.trim().toLowerCase();
      const res = document.getElementById('addSearchResults');
      if (!res) return;
      if (!q) { res.innerHTML=''; return; }
      const found = HSK3.filter(w =>
        w.hz.includes(e.target.value) ||
        w.py.toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g,c=>({ā:'a',á:'a',ǎ:'a',à:'a',ē:'e',é:'e',ě:'e',è:'e',ī:'i',í:'i',ǐ:'i',ì:'i',ō:'o',ó:'o',ǒ:'o',ò:'o',ū:'u',ú:'u',ǔ:'u',ù:'u',ǖ:'v',ǘ:'v',ǚ:'v',ǜ:'v'}[c]||c)).includes(q) ||
        w.vi.toLowerCase().includes(q)
      ).slice(0,6);
      if (!found.length) { res.innerHTML=`<div style="font-size:13px;font-style:italic;opacity:0.5;padding:8px 0">Không tìm thấy trong HSK 3</div>`; return; }
      res.innerHTML = found.map(w=>`<div class="word-row" style="margin-bottom:6px">
        <div class="word-row-hz">${w.hz}</div>
        <div style="flex:1"><div class="word-row-py">${w.py}</div><div class="word-row-vi">${w.vi}</div></div>
        <button style="background:var(--teal);border:none;color:white;padding:4px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-family:JetBrains Mono,monospace" data-addwrd="${encodeURIComponent(w.hz)}">+ Thêm</button>
      </div>`).join('');
    }
    if (e.target.id === 'searchInput') {
      const q = e.target.value.trim().toLowerCase();
      const placeholder = document.getElementById('searchPlaceholder');
      const empty = document.getElementById('searchEmpty');
      const results = document.getElementById('searchResults');
      if (!results) return;
      if (!q) { if(placeholder)placeholder.style.display=''; if(empty)empty.style.display='none'; results.innerHTML=''; return; }
      if(placeholder)placeholder.style.display='none';
      const found = HSK3.filter(w => w.hz.includes(e.target.value)||w.py.toLowerCase().includes(q)||w.vi.toLowerCase().includes(q)).slice(0,30);
      if(!found.length) { if(empty)empty.style.display=''; results.innerHTML=''; return; }
      if(empty)empty.style.display='none';
      results.innerHTML = found.map(w=>`<div class="word-row" data-wrd="${encodeURIComponent(w.hz)}">
        <div class="word-row-hz">${w.hz}</div>
        <div style="flex:1"><div class="word-row-py">${w.py}</div><div class="word-row-vi">${w.vi}</div></div>
        <button style="background:none;border:1px solid var(--border);border-radius:8px;padding:3px 8px;cursor:pointer;font-size:12px" data-speak="${w.hz}">🔊</button>
      </div>`).join('');
    }
  });

  // Keydown events
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'typeInput' && e.key === 'Enter') submitTyping();
    if (e.target.id === 'addInput' && e.key === 'Enter') doAddWord();
  });
}
function attachEvents() {
  // All click events handled by initGlobalEvents() global delegation
  // This function only handles non-delegatable per-render setup

  // Reset button
  const resetBtn = document.getElementById('resetBtn');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    if (confirm('Xóa toàn bộ tiến độ?')) {
      appState = { streak:0, lastDay:null, totalXP:0, totalWords:0, history:{}, wordSeen:{} };
      saveState(); render();
    }
  });

  // Flashcard card flip (needs direct binding because it's replaced each render)
  const fcCard = document.getElementById('fcCard');
  if (fcCard) fcCard.addEventListener('click', () => {
    screenData.flipped = !screenData.flipped;
    render();
    if (screenData.flipped && (currentScreen==='flashcard'||currentScreen==='lesson_vocab'))
      speak(screenData.words[screenData.idx].hz);
  });

  // Typing
  const typeInput = document.getElementById('typeInput');
  if (typeInput) {
    typeInput.addEventListener('input', e => { screenData.val = e.target.value; });
    typeInput.addEventListener('keydown', e => { if(e.key==='Enter') submitTyping(); });
    setTimeout(() => typeInput && typeInput.focus(), 80);
  }
  const typeSubmit = document.getElementById('typeSubmit');
  if (typeSubmit) typeSubmit.addEventListener('click', submitTyping);
  const typeSkip = document.getElementById('typeSkip');
  if (typeSkip) typeSkip.addEventListener('click', skipTyping);

  // Lesson vocab next
  const vocabNext = document.getElementById('vocabNext');
  if (vocabNext) vocabNext.addEventListener('click', () => {
    const { lesson, words, idx } = screenData;
    if (idx+1 >= words.length) { saveLessonProg(lesson.id, words.length); navigate('lesson_detail', {lesson}); }
    else { screenData.idx=idx+1; screenData.flipped=false; render(); }
  });

  // Exercise buttons
  const exInput = document.getElementById('exInput');
  if (exInput) {
    exInput.addEventListener('input', e => { screenData.answer = e.target.value; });
    setTimeout(() => exInput && exInput.focus(), 80);
  }
  const exSubmit = document.getElementById('exSubmit');
  if (exSubmit) exSubmit.addEventListener('click', submitExercise);
  const exNext = document.getElementById('exNext');
  if (exNext) exNext.addEventListener('click', () => {
    const {exercises, idx} = screenData;
    if (idx+1>=exercises.length) { screenData.completed=true; render(); }
    else { screenData.idx++; screenData.answer=''; screenData.feedback=null; screenData.loading=false; screenData.exTab='explain'; screenData.blankAnswers=null; screenData.blankChecked=false; render(); }
  });
  const checkBlanks = document.getElementById('checkBlanks');
  if (checkBlanks) checkBlanks.addEventListener('click', () => { screenData.blankChecked=true; render(); });
  const goToBlank = document.getElementById('goToBlank');
  if (goToBlank) goToBlank.addEventListener('click', () => {
    screenData.exTab='blank'; screenData.blankAnswers=(screenData.exercises[screenData.idx].blanks||[]).map(()=>''); screenData.blankChecked=false; render();
  });
  const goToFree = document.getElementById('goToFree');
  if (goToFree) goToFree.addEventListener('click', () => { screenData.exTab='free'; render(); });

  // Add word
  const addGoBtn = document.getElementById('addGoBtn');
  if (addGoBtn) addGoBtn.addEventListener('click', doAddWord);
  const addInput = document.getElementById('addInput');
  if (addInput) addInput.addEventListener('keydown', e => { if(e.key==='Enter') doAddWord(); });
  const addSearchInput = document.getElementById('addSearchInput');
  if (addSearchInput) setTimeout(() => addSearchInput && addSearchInput.focus(), 80);

  // Search
  const searchInput = document.getElementById('searchInput');
  if (searchInput) setTimeout(() => searchInput && searchInput.focus(), 80);

  // HanziWriter
  initHanziWriter();
}


// ===== GAME LOGIC =====
function initFlashcard() {
  const words = pickDaily();
  screenData = { words, idx:0, flipped:false, tab:'learn', ok:0, seen: words.map(w => appState.wordSeen[w.hz]||0) };
  navigate('flashcard');
}

function advanceFlashcard(score) {
  const { words, idx, ok } = screenData;
  const newOk = ok + (score >= 2 ? 1 : 0);
  const w = words[idx];
  screenData.seen[idx] = (screenData.seen[idx]||0)+1;
  appState.wordSeen[w.hz] = (appState.wordSeen[w.hz]||0)+1;
  if (idx + 1 >= words.length) finishGame(newOk, words.length);
  else { screenData.idx++; screenData.flipped=false; screenData.tab='learn'; screenData.ok=newOk; navigate('flashcard'); }
}

function initQuiz() {
  const words = pickDaily();
  const opts = getQuizOpts(words[0]);
  screenData = { words, idx:0, opts, picked:null, ok:0, seen: words.map(w => appState.wordSeen[w.hz]||0) };
  navigate('quiz');
}

function getQuizOpts(w) {
  const others = shuffle(HSK3.filter(x=>x.hz!==w.hz)).slice(0,3);
  return shuffle([w,...others]);
}

function advanceWord(mode) {
  const { words, idx, ok } = screenData;
  const newIdx = idx + 1;
  if (newIdx >= words.length) { finishGame(ok, words.length); return; }
  screenData.idx = newIdx;
  screenData.picked = null;
  if (mode === 'quiz') screenData.opts = getQuizOpts(words[newIdx]);
  navigate(mode);
}

const BATCH = 5;
function initMatch() {
  const words = pickDaily();
  startMatchBatch(words, 0, 0);
}

function startMatchBatch(words, batchIdx, ok) {
  const cur = words.slice(batchIdx*BATCH, batchIdx*BATCH+BATCH);
  const h = cur.map(w => ({ id:'h_'+w.hz, type:'hz', w }));
  const m = cur.map(w => ({ id:'m_'+w.hz, type:'me', w }));
  const tiles = shuffle([...h,...m]);
  screenData = { words, tiles, matched:new Set(), mismatch:null, sel:null,
    batchIdx, batchNum:batchIdx+1, totalBatches:Math.ceil(words.length/BATCH),
    progIdx: batchIdx*BATCH, ok };
  navigate('match');
}

function handleMatchTile(id) {
  const { tiles, matched, sel, words, batchIdx, ok } = screenData;
  if (matched.has(id) || screenData.mismatch) return;
  const t = tiles.find(x=>x.id===id);
  if (!sel) { screenData.sel=id; speak(t.w.hz); render(); return; }
  if (sel===id) { screenData.sel=null; render(); return; }
  const selT = tiles.find(x=>x.id===sel);
  if (selT.w.hz===t.w.hz && selT.type!==t.type) {
    matched.add(sel); matched.add(id);
    screenData.ok = ok+1; screenData.sel=null;
    speak(t.w.hz);
    render();
    if (matched.size === tiles.length) {
      setTimeout(() => {
        if ((batchIdx+1)*BATCH >= words.length) finishGame(screenData.ok, words.length);
        else startMatchBatch(words, batchIdx+1, screenData.ok);
      }, 700);
    }
  } else {
    screenData.mismatch=[sel,id]; screenData.sel=null;
    render();
    setTimeout(() => { screenData.mismatch=null; render(); }, 600);
  }
}

function initTyping() {
  const words = pickDaily();
  screenData = { words, idx:0, val:'', status:null, ok:0, seen: words.map(w => appState.wordSeen[w.hz]||0) };
  navigate('typing');
}

function normPy(s) {
  return s.toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü\s]/g, c =>
    ({ā:'a',á:'a',ǎ:'a',à:'a',ē:'e',é:'e',ě:'e',è:'e',ī:'i',í:'i',ǐ:'i',ì:'i',ō:'o',ó:'o',ǒ:'o',ò:'o',ū:'u',ú:'u',ǔ:'u',ù:'u',ǖ:'v',ǘ:'v',ǚ:'v',ǜ:'v',ü:'v',' ':''}[c]||''));
}

function submitTyping() {
  if (screenData.status) return;
  const w = screenData.words[screenData.idx];
  const correct = normPy(screenData.val.trim()) === normPy(w.py);
  if (correct) screenData.ok++;
  screenData.seen[screenData.idx] = (screenData.seen[screenData.idx]||0)+1;
  appState.wordSeen[w.hz] = (appState.wordSeen[w.hz]||0)+1;
  screenData.status = correct?'ok':'no';
  render();
  setTimeout(() => speak(w.hz), 200);
  setTimeout(() => {
    if (screenData.idx+1>=screenData.words.length) finishGame(screenData.ok, screenData.words.length);
    else { screenData.idx++; screenData.val=''; screenData.status=null; navigate('typing'); }
  }, 1200);
}

function skipTyping() {
  const w = screenData.words[screenData.idx];
  screenData.seen[screenData.idx] = (screenData.seen[screenData.idx]||0)+1;
  appState.wordSeen[w.hz] = (appState.wordSeen[w.hz]||0)+1;
  screenData.status='no';
  render();
  speak(w.hz);
  setTimeout(() => {
    if (screenData.idx+1>=screenData.words.length) finishGame(screenData.ok, screenData.words.length);
    else { screenData.idx++; screenData.val=''; screenData.status=null; navigate('typing'); }
  }, 1200);
}

function finishGame(correct, total) {
  const xp = Math.round((correct/Math.max(total,1))*25)+correct;
  const t = today();
  appState.totalXP = (appState.totalXP||0)+xp;
  appState.totalWords = (appState.totalWords||0)+total;
  if (!appState.history[t]) appState.history[t]={games:0,xp:0};
  appState.history[t].games++;
  appState.history[t].xp+=xp;
  if (appState.lastDay!==t) { appState.streak=(appState.streak||0)+1; appState.lastDay=t; }
  saveState();
  navigate('done', { correct, total, xp });
}

// ===== LESSON VOCAB =====
function initLessonVocab(lesson) {
  const words = lesson.words.map(hz => HSK3.find(w=>w.hz===hz||w.hz.startsWith(hz))||{hz,py:'—',vi:'(xem sách)',ex:'',exv:''});
  screenData = { lesson, words, idx:0, flipped:false };
  navigate('lesson_vocab');
}

function saveLessonProg(id, count) {
  try {
    const p = JSON.parse(localStorage.getItem('hsk3_lesson_prog')||'{}');
    p[id] = Math.max(p[id]||0, count);
    localStorage.setItem('hsk3_lesson_prog', JSON.stringify(p));
  } catch {}
}

// ===== LESSON EXERCISE (AI) =====
function initLessonExercise(lesson) {
  const exercises = GRAMMAR_EXERCISES[lesson.id] || [];
  screenData = { lesson, exercises, idx:0, answer:'', feedback:null, loading:false, completed:false, exTab:'explain', blankAnswers:null, blankChecked:false };
  navigate('lesson_exercise');
}

async function submitExercise() {
  const { exercises, idx, answer } = screenData;
  const ex = exercises[idx];
  if (!answer.trim()) return;
  screenData.loading = true;
  render();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:600,
        messages:[{ role:'user', content:`Bạn là giáo viên tiếng Trung. Điểm ngữ pháp: "${ex.pattern}". Yêu cầu: "${ex.prompt}". Câu học sinh viết: "${answer}". Trả lời CHỈNH XÁC theo JSON (không có text khác): {"correct":true/false,"score":1-10,"comment":"nhận xét ngắn bằng tiếng Việt","correction":"câu đúng nếu sai (để trống nếu đúng)","explanation":"giải thích ngắn tiếng Việt"}` }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(c=>c.type==='text')?.text||'';
    const match = text.match(/\{[\s\S]*\}/);
    if (match) screenData.feedback = JSON.parse(match[0]);
    else screenData.feedback = {correct:false,score:0,comment:'Không kết nối được. Thử lại.',correction:'',explanation:''};
  } catch {
    screenData.feedback = {correct:false,score:0,comment:'Lỗi kết nối. Kiểm tra internet.',correction:'',explanation:''};
  }
  screenData.loading = false;
  render();
}

// ===== ADD WORD (AI) =====
async function doAddWord() {
  const input = document.getElementById('addInput');
  const word = input?.value.trim();
  if (!word) return;
  const existing = HSK3.find(w=>w.hz===word);
  if (existing) { document.getElementById('addError').style.display=''; document.getElementById('addError').textContent=`"${word}" đã có trong HSK 3!`; return; }
  document.getElementById('addError').style.display='none';
  document.getElementById('addLoading').style.display='block';
  document.getElementById('addLoadingChar').textContent=word;
  document.getElementById('addResult').style.display='none';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:800,
        messages:[{ role:'user', content:`Từ tiếng Trung: "${word}". Trả lời CHÍNH XÁC theo JSON (không có text nào khác): {"hz":"${word}","py":"pinyin","vi":"nghĩa tiếng Việt ngắn","ex":"câu ví dụ tiếng Trung","exv":"dịch tiếng Việt","radical":"bộ thủ chính","radicalName":"tên bộ thủ tiếng Việt Hán-Việt","strokes":số_nét,"meaning":"giải thích nguồn gốc ngắn"}` }]
      })
    });
    const data = await res.json();
    const text = data.content?.find(c=>c.type==='text')?.text||'';
    const match = text.match(/\{[\s\S]*\}/);
    if (!match) throw new Error();
    const parsed = JSON.parse(match[0]);
    document.getElementById('addLoading').style.display='none';
    document.getElementById('addResult').style.display='block';
    document.getElementById('addResult').innerHTML = `
      <div class="word-preview" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)">
          <div><div style="font-family:Noto Serif SC,serif;font-size:48px;font-weight:500;line-height:1">${parsed.hz}</div><div style="font-style:italic;font-size:16px;color:var(--red);margin-top:6px">${parsed.py}</div></div>
          <div style="font-size:13px;font-style:italic;opacity:0.7;max-width:140px;text-align:right;line-height:1.4">${parsed.vi}</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          <div style="background:var(--paper3);border-radius:10px;padding:10px 12px"><div style="font-family:JetBrains Mono,monospace;font-size:9px;opacity:0.45;text-transform:uppercase;margin-bottom:3px">Bộ thủ</div><div style="font-family:Noto Serif SC,serif;font-size:18px;color:var(--red)">${parsed.radical}</div><div style="font-style:italic;font-size:11px;opacity:0.6">${parsed.radicalName}</div></div>
          <div style="background:var(--paper3);border-radius:10px;padding:10px 12px"><div style="font-family:JetBrains Mono,monospace;font-size:9px;opacity:0.45;text-transform:uppercase;margin-bottom:3px">Số nét</div><div style="font-size:22px;font-weight:600;color:var(--gold)">${parsed.strokes}</div></div>
        </div>
        <div style="font-style:italic;font-size:13px;line-height:1.6;opacity:0.75;margin-bottom:10px">${parsed.meaning}</div>
        <div style="background:var(--paper3);border-radius:10px;padding:10px 12px;border-left:3px solid var(--red)"><div style="font-family:Noto Serif SC,serif;font-size:15px;margin-bottom:3px">${parsed.ex}</div><div style="font-style:italic;font-size:12px;opacity:0.65">${parsed.exv}</div></div>
      </div>
      <button id="addSaveBtn" class="btn-tool" style="background:var(--teal)"><span>+ Thêm vào danh sách học</span><span>→</span></button>`;
    const _sb = document.getElementById('addSaveBtn');
    if (_sb) _sb.addEventListener('click', () => {
      const custom = JSON.parse(localStorage.getItem('hsk3_custom')||'[]');
      custom.push(parsed);
      localStorage.setItem('hsk3_custom', JSON.stringify(custom));
      HSK3.push(parsed);
      alert(`Đã thêm "${parsed.hz}" vào danh sách!`);
      input.value='';
      navigate('addword');
    });
  } catch {
    document.getElementById('addLoading').style.display='none';
    document.getElementById('addError').style.display='';
    document.getElementById('addError').textContent='Không tra được từ này. Kiểm tra kết nối internet.';
  }
}

// ===== HANZI WRITER =====
let hanziWriter = null;
function initHanziWriter(mode) {
  if (currentScreen !== 'flashcard' || screenData.tab !== 'write') return;
  const container = document.getElementById('hanziContainer');
  if (!container || !window.HanziWriter) return;
  container.innerHTML = '';
  const char = screenData.words[screenData.idx].hz[0];
  try {
    hanziWriter = HanziWriter.create(container, char, {
      width:280, height:280, padding:20,
      strokeColor:'#1a1814', radicalColor:'#d4341f',
      outlineColor:'rgba(26,24,20,0.12)',
      drawingColor:'#1a1814', drawingWidth:8,
      showCharacter: mode!=='quiz',
      showOutline:true, strokeAnimationSpeed:1,
      highlightColor:'#2e6b6b',
      onLoadCharDataError:()=>{}
    });
    if (!mode || mode==='demo') hanziWriter.loopCharacterAnimation();
    else if (mode==='practice') hanziWriter.animateCharacter();
    else if (mode==='quiz') hanziWriter.quiz({ onComplete:()=>{} });
  } catch(e) {}
  // Draw grid
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;pointer-events:none');
  svg.setAttribute('viewBox','0 0 280 280');
  svg.innerHTML=`<line x1="140" y1="0" x2="140" y2="280" stroke="rgba(212,52,31,0.1)" stroke-width="1"/>
    <line x1="0" y1="140" x2="280" y2="140" stroke="rgba(212,52,31,0.1)" stroke-width="1"/>
    <line x1="0" y1="0" x2="280" y2="280" stroke="rgba(212,52,31,0.06)" stroke-width="1"/>
    <line x1="280" y1="0" x2="0" y2="280" stroke="rgba(212,52,31,0.06)" stroke-width="1"/>`;
  container.style.position='relative';
  container.appendChild(svg);
}


// ===== ADD FROM SEARCH =====
function addToList(encodedHz) {
  const hz = decodeURIComponent(encodedHz);
  const w = HSK3.find(x => x.hz === hz);
  if (!w) return;
  const custom = JSON.parse(localStorage.getItem('hsk3_custom')||'[]');
  if (custom.find(x=>x.hz===hz)) { alert(`"${hz}" đã có trong danh sách rồi!`); return; }
  custom.push(w);
  localStorage.setItem('hsk3_custom', JSON.stringify(custom));
  alert(`Đã thêm "${hz}" (${w.py} · ${w.vi}) vào danh sách học!`);
  navigate('addword');
}
